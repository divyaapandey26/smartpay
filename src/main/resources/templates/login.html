<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartPay — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center" style="min-height: 100vh; align-items: center;">
        <div class="col-md-5">
            <div class="card">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <h2 style="color: #1e3a8a; font-weight: 700;">💰 SmartPay</h2>
                        <p class="text-muted mb-0">Sign in to your account</p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger py-2">
                        Invalid username or password.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success py-2">
                        You have been logged out.
                    </div>
                    <div th:if="${param.registered}" class="alert alert-success py-2">
                        Account created. Please sign in.
                    </div>

                    <form method="post" action="/login">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Sign In</button>
                    </form>

                    <hr class="my-4">

                    <div class="text-center">
                        <span class="text-muted">Don't have an account?</span>
                        <a href="/signup" class="ms-1">Sign up</a>
                    </div>

                    <div class="mt-3 p-3 bg-light rounded" style="font-size: 0.85rem;">
                        <strong>Demo credentials:</strong><br>
                        Admin: <code>divya</code> / <code>divya123</code><br>
                        User:  <code>shweta</code> / <code>shweta123</code>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
