<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>SmartPay — Fee Compare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/styles.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark navbar-sp">
    <div class="container">
        <a class="navbar-brand" href="/">💰 SmartPay</a>
        <div class="d-flex align-items-center">
            <a href="/" class="btn btn-nav me-2">Dashboard</a>
            <a href="/compare" class="btn btn-nav me-2">Fee Compare</a>
            <a href="/compare-apps" class="btn btn-nav me-2">App Compare</a>
            <a href="/token" class="btn btn-nav me-2">Tokens</a>
            <a href="/history" class="btn btn-nav me-2">History</a>
            <a href="/offline-queue" class="btn btn-nav me-2">Offline</a>
            <a href="/optimizer" class="btn btn-nav me-3">Optimizer</a>
            <span class="text-white me-2" style="font-size: 0.85rem;">
                    Hi, <strong sec:authentication="name">user</strong>
                </span>
            <form method="post" action="/logout" class="d-inline">
                <button type="submit" class="btn btn-nav">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-3">Compare Payment Methods</h2>
    <p class="text-muted">Find the cheapest payment method for any transaction amount.</p>

    <div class="card mb-4">
        <div class="card-body">
            <form method="get" action="/compare">
                <div class="row g-3 align-items-end">
                    <div class="col-md-8">
                        <label class="form-label">Amount (₹)</label>
                        <input type="number" name="amount" class="form-control"
                               th:value="${amount}" placeholder="Enter amount"
                               step="any" min="0" autocomplete="off" required>
                    </div>
                    <div class="col-md-4">
                        <button type="submit" class="btn btn-primary w-100">Compare</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="card" th:if="${result != null}">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0" style="font-size: 0.95rem;">Result for ₹<span th:text="${amount}">0</span></h5>
        </div>
        <div class="card-body">
            <table class="table">
                <thead>
                <tr>
                    <th>Method</th>
                    <th class="text-end">Fee (₹)</th>
                </tr>
                </thead>
                <tbody>
                <tr><td>UPI</td><td class="text-end" th:text="${result.upiFee}">0</td></tr>
                <tr><td>Cash</td><td class="text-end" th:text="${result.cashFee}">0</td></tr>
                <tr><td>Split</td><td class="text-end" th:text="${result.splitFee}">0</td></tr>
                </tbody>
            </table>

            <div class="alert alert-success mb-0">
                <strong>Recommended:</strong> <span th:text="${result.recommended}">UPI</span>
                &nbsp;|&nbsp;
                <strong>You save:</strong> ₹<span th:text="${result.savings}">0</span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
