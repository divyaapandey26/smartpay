<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Offline Payment Tokens</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">💰 SmartPay</a>
        <div>
            <a href="/" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
            <a href="/compare" class="btn btn-outline-light btn-sm me-2">Fee Compare</a>
            <a href="/compare-apps" class="btn btn-outline-light btn-sm me-2">App Compare</a>
            <a href="/token" class="btn btn-outline-light btn-sm me-2">Tokens</a>
            <a href="/history" class="btn btn-outline-light btn-sm">History</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-3">Offline Payment Tokens</h2>

    <div class="row">
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header bg-warning">
                    <h5 class="mb-0">1. Generate Token</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Sender ID</label>
                        <input type="number" id="senderId" class="form-control"
                               value="1" min="1" step="1" autocomplete="off" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount (₹)</label>
                        <input type="number" id="amount" class="form-control"
                               value="500" min="0" step="any" autocomplete="off" required>
                    </div>
                    <button type="button" class="btn btn-warning w-100" onclick="generateToken()">Generate Token</button>
                    <div id="tokenResult" class="mt-3"></div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">2. Settle Token</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Token</label>
                        <textarea id="token" class="form-control" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Receiver ID</label>
                        <input type="number" id="receiverId" class="form-control"
                               value="2" min="1" step="1" autocomplete="off" required>
                    </div>
                    <button type="button" class="btn btn-success w-100" onclick="settleToken()">Settle Token</button>
                    <div id="settleResult" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    async function generateToken() {
        const senderId = document.getElementById('senderId').value.trim();
        const amount = document.getElementById('amount').value.trim();

        if (!senderId || !amount) {
            alert('Please enter Sender ID and Amount');
            return;
        }

        try {
            const res = await fetch('/api/token/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ senderId: senderId, amount: amount })
            });
            const data = await res.json();

            if (data.token) {
                document.getElementById('token').value = data.token;
                document.getElementById('tokenResult').innerHTML =
                    '<div class="alert alert-success"><strong>✅ Token generated!</strong><br>Copied to settle box.</div>';
            } else {
                document.getElementById('tokenResult').innerHTML =
                    '<div class="alert alert-danger"><strong>❌ ' + (data.error || 'Failed to generate') + '</strong></div>';
            }
        } catch (e) {
            document.getElementById('tokenResult').innerHTML =
                '<div class="alert alert-danger"><strong>❌ ' + e.message + '</strong></div>';
        }
    }

    async function settleToken() {
        const token = document.getElementById('token').value.trim();
        const receiverId = document.getElementById('receiverId').value.trim();

        if (!token || !receiverId) {
            alert('Please generate/paste a token and enter Receiver ID');
            return;
        }

        try {
            const res = await fetch('/api/token/settle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, receiverId: receiverId })
            });

            const data = await res.json();
            const resultDiv = document.getElementById('settleResult');

            if (data.status === 'SUCCESS') {
                resultDiv.innerHTML = '<div class="alert alert-success"><strong>✅ SUCCESS</strong><br>Amount: ₹' + data.amount + '<br>From: User ' + data.senderId + ' → To: User ' + data.receiverId + '</div>';
            } else {
                resultDiv.innerHTML = '<div class="alert alert-danger"><strong>❌ ' + (data.error || 'Unknown error') + '</strong></div>';
            }
        } catch (e) {
            document.getElementById('settleResult').innerHTML =
                '<div class="alert alert-danger"><strong>❌ ' + e.message + '</strong></div>';
        }
    }
</script>
</body>
</html>
