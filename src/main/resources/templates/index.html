<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartPay Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">💰 SmartPay</a>
        <div>
            <a href="/" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
            <a href="/compare" class="btn btn-outline-light btn-sm me-2">Compare</a>
            <a href="/token" class="btn btn-outline-light btn-sm">Tokens</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-3">Users &amp; Balances</h2>

    <div class="card mb-4">
        <div class="card-body">
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th class="text-end">Balance (₹)</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}">1</td>
                    <td th:text="${user.name}">Name</td>
                    <td class="text-end" th:text="${user.balance}">0</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <h2 class="mb-3">⚠️ Overcharge Alerts</h2>

    <div class="card mb-4">
        <div class="card-body">
            <p th:if="${alerts == null or alerts.isEmpty()}" class="text-muted mb-0">
                No alerts yet. Trigger an overcharge to see it here.
            </p>
            <table class="table table-striped mb-0" th:if="${alerts != null and !alerts.isEmpty()}">
                <thead>
                <tr>
                    <th>Method</th>
                    <th class="text-end">Amount</th>
                    <th class="text-end">Expected Fee</th>
                    <th class="text-end">Charged</th>
                    <th class="text-end">Extra</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="alert : ${alerts}">
                    <td th:text="${alert.method}">UPI</td>
                    <td class="text-end" th:text="${alert.amount}">0</td>
                    <td class="text-end" th:text="${alert.expectedFee}">0</td>
                    <td class="text-end" th:text="${alert.feeCharged}">0</td>
                    <td class="text-end text-danger fw-bold" th:text="${alert.extraCharged}">0</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
